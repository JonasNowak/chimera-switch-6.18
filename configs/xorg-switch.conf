# /etc/X11/xorg.conf.d/20-switch-tegra.conf
# ==============================================================================
# Xorg Display & Touch Configuration for Nintendo Switch v1 "Erista" (T210)
# Kernel: Linux 6.18 (Enigma R20 linux-nx)
#
# Key Requirements:
# 1. modesetting driver bound to Tegra Display Controller (/dev/dri/card0)
# 2. AccelMethod "none" to disable Glamor 3D acceleration (avoids the Nouveau
#    GM20B glClear SIGSEGV in Mesa on Linux 6.18)
# 3. Rotate "right" (Switch internal DSI LCD is physically a 720x1280 portrait
#    panel mounted sideways; 90-degree CW rotation yields 1280x720 landscape)
# 4. Touchscreen calibration matrix for STM FTM4 to map coordinates to landscape
# ==============================================================================

Section "Device"
    Identifier  "Tegra-KMS"
    Driver      "modesetting"
    Option      "kmsdev" "/dev/dri/card0"
    # Glamor 3D crashes on Enigma R20 Mesa; CPU rendering via llvmpipe is stable
    Option      "AccelMethod" "none"
    Option      "SWcursor" "true"
    Option      "Shadow" "true"
EndSection

Section "Monitor"
    Identifier  "DSI-1"
    # Switch internal LCD: rotate 90 degrees clockwise to 1280x720 landscape
    Option      "Rotate" "right"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "Tegra-KMS"
    Monitor     "DSI-1"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1280x720"
    EndSubSection
EndSection

Section "InputClass"
    Identifier  "Switch FTM4 Capacitive Touchscreen"
    MatchIsTouchscreen "on"
    Driver      "libinput"
    # Clockwise 90-degree coordinate transformation matrix:
    # [ 0  1  0 ]
    # [-1  0  1 ]
    # [ 0  0  1 ]
    Option      "TransformationMatrix" "0 1 0 -1 0 1 0 0 1"
    Option      "CalibrationMatrix" "0 1 0 -1 0 1 0 0 1"
    Option      "Tapping" "on"
    Option      "DragLockButtons" ""
EndSection
